server:
  service:
    port: 443
  containerPort: 9445

  apiService:
    enabled: true
    name: v1alpha1.wardle.example.com
    group: wardle.example.com
    version: v1alpha1
    groupPriorityMinimum: 1000
    versionPriority: 15

  tls:
    mode: cert-manager
    certManager:
      createSelfSignedIssuer: true

backend:
  url: https://api-backend.wardle.svc.cluster.local:443

  tls:
    insecureSkipVerify: true
    serverName: api-backend.wardle.svc.cluster.local

  identity:
    mode: impersonation
    impersonation:
      forwardUid: true
      extras:
        mode: none
      rbac:
        # No impersonation RBAC: the backend must reject the proxy ServiceAccount
        # with a clean 403 cannot-impersonate error.
        create: false

  testApiserver:
    enabled: true
    nameOverride: api-backend
    backendClientCert:
      selfSignedIssuerName: audit-pass-through-backend-selfsigned
      caSecretName: audit-pass-through-backend-client-ca
      caIssuerName: audit-pass-through-backend-client-ca-issuer
      clientSecretName: audit-pass-through-backend-client-cert

audit:
  webhook:
    kubeconfigSecretName: audit-pass-through-webhook-kubeconfig

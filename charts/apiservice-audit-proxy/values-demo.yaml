# Demo values for a complete local install:
# - Wardle sample-apiserver (the demo backend) at backend.testApiserver
# - apiservice-audit-proxy fronting that backend
# - webhook-tester (the demo audit receiver) at audit.testWebhookReceiver
#
# This demo uses the chart's default backend identity posture: impersonation.
# The proxy calls the Wardle backend as its ServiceAccount and translates the
# verified front-proxy user into Kubernetes Impersonate-* headers.

server:
  apiService:
    enabled: true
    group: wardle.example.com
    name: v1alpha1.wardle.example.com
    version: v1alpha1

backend:
  url: "https://api-backend.wardle.svc:443"

  tls:
    insecureSkipVerify: true

  identity:
    mode: impersonation
    impersonation:
      rbac:
        create: true

  testApiserver:
    enabled: true
    nameOverride: api-backend

audit:
  testWebhookReceiver:
    enabled: true

# Demo values for a complete local install:
# - Wardle sample-apiserver (the demo backend) at backend.testApiserver
# - apiservice-audit-proxy fronting that backend
# - webhook-tester (the demo audit receiver) at audit.testWebhookReceiver
#
# This demo pins backend.identity.mode=requestheader: it uses backend mTLS
# client cert auth (the testApiserver path that's already wired up here). The
# default chart value is impersonation, which is exercised by the dedicated
# impersonation e2e values (test/e2e/values/proxy-impersonation.yaml).

server:
  apiService:
    enabled: true
    group: wardle.example.com
    name: v1alpha1.wardle.example.com
    version: v1alpha1

backend:
  url: "https://api-backend.wardle.svc:443"

  tls:
    insecureSkipVerify: true

  identity:
    mode: requestheader
    requestheader:
      clientCert:
        secretName: audit-pass-through-backend-client-cert

  testApiserver:
    enabled: true
    nameOverride: api-backend
    backendClientCert:
      selfSignedIssuerName: audit-pass-through-backend-selfsigned
      caSecretName: audit-pass-through-backend-client-ca
      caIssuerName: audit-pass-through-backend-client-ca-issuer
      clientSecretName: audit-pass-through-backend-client-cert

audit:
  testWebhookReceiver:
    enabled: true

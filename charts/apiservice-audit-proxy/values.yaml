# apiservice-audit-proxy chart values
#
# Three top-level functional sections mirror the architecture:
#
#   server  -- inbound:  kube-apiserver -> proxy
#   backend -- outbound: proxy -> backend (the aggregated API server)
#   audit   -- outbound: proxy -> audit receiver (synthetic audit events)
#
# Pod/Helm boilerplate (image, resources, serviceAccount, nodeSelector, ...)
# stays flat at the top by Helm convention.

replicaCount: 1

image:
  repository: ghcr.io/configbutler/apiservice-audit-proxy
  pullPolicy: IfNotPresent
  tag: 0.4.0 # x-release-please-version

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532

# ============================================================================
# Inbound: kube-apiserver -> apiservice-audit-proxy
# ============================================================================
# Inbound requestheader trust (the front-proxy CA, accepted client names, and
# identity header names) is sourced live from the cluster's
# kube-system/extension-apiserver-authentication ConfigMap. There is no
# server.requestHeader.* configuration and no CA Secret to manage: the chart's
# kube-system RoleBinding (templates/auth-reader-rbac.yaml) grants the proxy
# ServiceAccount read access, and CA rotation is picked up automatically.
server:
  # Kubernetes Service that fronts the proxy. kube-apiserver reaches the proxy
  # at this Service when the APIService registration below is enabled.
  service:
    type: ClusterIP
    port: 443

  # Address the proxy process listens on inside the pod, and the matching
  # containerPort exposed by the Deployment. These two must agree.
  listenAddress: ":9445"
  containerPort: 9445

  # APIService registration that makes kube-apiserver route aggregated API
  # traffic to this proxy.
  apiService:
    enabled: false
    annotations: {}
    caBundle: ""
    group: wardle.example.com
    groupPriorityMinimum: 1000
    insecureSkipTLSVerify: false
    name: v1alpha1.wardle.example.com
    version: v1alpha1
    versionPriority: 15

  # How the proxy obtains its own HTTPS serving certificate. kube-apiserver
  # trusts this cert via APIService.spec.caBundle (or cert-manager injection)
  # when it reaches the proxy.
  #
  #   self-signed     - chart generates a self-signed CA+cert on first install,
  #                     embeds the CA into APIService.spec.caBundle, and uses
  #                     lookup to preserve the Secret across helm upgrades.
  #   cert-manager    - chart creates a cert-manager Issuer/Certificate; the
  #                     APIService is annotated for cert-manager CA injection.
  #   existing-secret - operator owns the Secret named by existingSecretName;
  #                     supply server.apiService.caBundle or set
  #                     server.apiService.insecureSkipTLSVerify=true.
  tls:
    mode: self-signed
    existingSecretName: ""
    selfSigned:
      secretName: ""
    certManager:
      certificateName: ""
      createSelfSignedIssuer: false
      duration: 2160h
      issuerRef:
        group: cert-manager.io
        kind: Issuer
        name: ""
      renewBefore: 360h
      secretName: ""
      selfSignedIssuerName: ""

# ============================================================================
# Outbound: apiservice-audit-proxy -> backend (the aggregated API server)
# ============================================================================
backend:
  url: "https://sample-apiserver.wardle.svc:443"

  # How the proxy verifies the backend's serving TLS certificate. Mode-
  # independent: applies whether the proxy authenticates via impersonation or
  # requestheader. Symmetric with server.tls (how kube-apiserver verifies the
  # proxy's serving cert).
  tls:
    insecureSkipVerify: true
    serverName: ""
    caSecretName: ""
    caFileName: ca.crt

  identity:
    # Identity the proxy presents to the backend.
    #   impersonation  - default; call the backend as the proxy ServiceAccount
    #                    and translate the verified user into Impersonate-*
    #                    headers. Backend only needs to trust the proxy SA.
    #   requestheader  - forward the inbound X-Remote-* headers. Requires the
    #                    backend to share the front-proxy requestheader CA.
    mode: impersonation

    impersonation:
      # ServiceAccount token file used as the backend bearer token.
      tokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
      # Project Impersonate-Uid when the verified identity has a UID.
      forwardUid: true
      extras:
        # Extra projection mode:
        #   none      - do not forward user extras.
        #   allowlist - forward only keys listed below.
        #   all       - forward every inbound extra and render broad RBAC.
        mode: none
        # Allowlist of decoded extra keys. Single source of truth when
        # mode=allowlist: drives both emitted Impersonate-Extra-* headers and
        # rendered userextras RBAC.
        keys: []
      rbac:
        # Render the impersonator ClusterRole/ClusterRoleBinding. Off by
        # default; only valid when mode=impersonation.
        create: false

    requestheader:
      # Optional mTLS client certificate the proxy presents to the backend in
      # requestheader mode (so the backend can authenticate the proxy itself,
      # separately from the verified X-Remote-* identity it forwards). Not
      # consulted in impersonation mode.
      clientCert:
        secretName: ""
        certFileName: tls.crt
        keyFileName: tls.key

  # Optional demo backend: Kubernetes sample-apiserver (Wardle). Disabled by
  # default -- in a real install the backend is your own aggregated API server.
  # Enabling this only renders the test backend resources; backend.url,
  # backend.tls.*, and server.apiService.enabled stay explicit. See
  # values-demo.yaml for a complete demo install.
  testApiserver:
    enabled: false
    nameOverride: ""

    image:
      repository: registry.k8s.io/e2e-test-images/sample-apiserver
      pullPolicy: IfNotPresent
      tag: "1.33.8"

    etcd:
      image:
        repository: registry.k8s.io/etcd
        pullPolicy: IfNotPresent
        tag: "v3.6.8"

    replicaCount: 1

    serviceAccount:
      annotations: {}
      name: ""

    service:
      type: ClusterIP
      port: 443

    backendClientCert:
      selfSignedIssuerName: ""
      caSecretName: ""
      caIssuerName: ""
      clientSecretName: ""

    backendServingCert:
      enabled: false
      selfSignedIssuerName: ""
      caSecretName: ""
      caIssuerName: ""
      certSecretName: ""
      dnsNames: []

    resources: {}
    etcdResources: {}
    podAnnotations: {}
    podSecurityContext: {}
    securityContext: {}
    nodeSelector: {}
    tolerations: []
    affinity: {}

# ============================================================================
# Outbound: apiservice-audit-proxy -> audit receiver
# ============================================================================
# Audit event capture and delivery. The proxy buffers request/response bodies
# (capture) and POSTs synthetic audit events to a receiver (webhook).
audit:
  maxBodyBytes: 1048576
  captureTempDir: ""

  # Outbound audit webhook delivery: the kubeconfig Secret naming the receiver
  # the proxy POSTs synthetic audit events to, and the per-request timeout.
  webhook:
    kubeconfigSecretName: audit-pass-through-webhook-kubeconfig
    kubeconfigKey: kubeconfig
    timeout: 5s

  # Optional demo audit receiver: the webhook-tester image, which displays
  # incoming audit events in a live browser UI. Disabled by default -- in a real
  # install your audit receiver is e.g. GitOps Reverser. When enabled, the chart
  # generates the Secret named by audit.webhook.kubeconfigSecretName and points
  # it at the in-cluster webhook-tester Service. Mirrors backend.testApiserver
  # structurally.
  testWebhookReceiver:
    enabled: false

    image:
      repository: ghcr.io/tarampampam/webhook-tester
      pullPolicy: IfNotPresent
      tag: "2.3.0"

    replicaCount: 1

    # Session UUID for proxy audit events (Lane B). Baked into the generated
    # webhook kubeconfig and forms the path the proxy POSTs to. Also the path
    # you open in the browser UI. A fixed value means the browser URL and
    # kubeconfig are stable across Helm upgrades.
    proxySessionUUID: "aabbccdd-0000-4000-0000-000000000002"

    # Session UUID for kube-apiserver native audit events (Lane A). The e2e
    # cluster's audit webhook-config.yaml points here. Informational only --
    # the chart does not configure the kube-apiserver. Printed in Helm NOTES
    # so the two browser URLs are shown side-by-side.
    kubeApiserverSessionUUID: "aabbccdd-0000-4000-0000-000000000001"

    # Maximum number of requests stored per session (in-memory).
    maxRequests: 128

    service:
      type: ClusterIP
      port: 8080

    ingress:
      enabled: true
      # ingressClassName selects the Ingress controller. k3d ships Traefik by default.
      className: traefik
      # host: "" means the Ingress rule matches any hostname (useful for local clusters).
      # Set to a real hostname (e.g. webhook-tester.example.com) for production-style access.
      host: ""
      annotations: {}

    resources: {}

    podAnnotations: {}

    # webhook-tester runs as UID 10001 (from the upstream image).
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 10001
      runAsGroup: 10001
      seccompProfile:
        type: RuntimeDefault

    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      runAsUser: 10001
      runAsGroup: 10001

# ============================================================================
# Metrics
# ============================================================================
# Dedicated metrics listener, scraper resources, and optional TLS for the
# /metrics endpoint. Plain HTTP by default; on a dedicated metrics port that is
# usually fine. Enable tls.enabled when cluster policy requires authenticated
# or encrypted scrapes.
metrics:
  # Address the metrics server listens on inside the pod, and the matching
  # containerPort and Service port. Set listenAddress to "0" to disable the
  # listener, the container port, and the Service port together.
  listenAddress: ":8080"
  containerPort: 8080
  service:
    port: 8080

  # Optional TLS for the metrics endpoint.
  tls:
    enabled: false
    # Existing Secret in the release namespace containing tls.crt and tls.key.
    # Required when tls.enabled is true.
    secretName: ""

  # Prometheus Operator ServiceMonitor.
  serviceMonitor:
    enabled: false
    namespace: ""
    labels: {}
    interval: 30s
    scrapeTimeout: 10s
    path: /metrics
    port: metrics
    # Must match the effective metrics transport:
    # - https when metrics.tls.enabled=true
    # - http  when metrics.tls.enabled=false
    scheme: http
    tlsConfig: {}

  # VictoriaMetrics Operator VMServiceScrape.
  vmServiceScrape:
    enabled: false
    namespace: ""
    labels: {}
    interval: 30s
    path: /metrics
    port: metrics
    scheme: http
    tlsConfig: {}

# Compute resources for the proxy container.
resources: {}

nodeSelector: {}
tolerations: []
affinity: {}

extraArgs: []
env: []
volumes: []
volumeMounts: []

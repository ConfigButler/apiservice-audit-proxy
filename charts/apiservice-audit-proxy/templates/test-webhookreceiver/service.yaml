{{- if .Values.audit.testWebhookReceiver.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "apiservice-audit-proxy.testWebhookReceiver.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "apiservice-audit-proxy.testWebhookReceiver.labels" . | nindent 4 }}
spec:
  type: {{ .Values.audit.testWebhookReceiver.service.type }}
  selector:
    {{- include "apiservice-audit-proxy.testWebhookReceiver.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.audit.testWebhookReceiver.service.port }}
      targetPort: http
      protocol: TCP
{{- end }}

{{- $identityMode := .Values.backend.identity.mode -}}
{{- $impersonation := .Values.backend.identity.impersonation -}}
{{- $extrasMode := $impersonation.extras.mode | default "none" -}}
{{- if hasKey .Values.backend "identityMode" }}
{{- fail "backend.identityMode has moved to backend.identity.mode" }}
{{- end }}
{{- if hasKey .Values.backend "impersonation" }}
{{- fail "backend.impersonation has moved to backend.identity.impersonation" }}
{{- end }}
{{- if hasKey $impersonation "extraKeys" }}
{{- fail "backend.identity.impersonation.extraKeys has moved to backend.identity.impersonation.extras.keys" }}
{{- end }}
{{- if hasKey $impersonation "forwardAllExtras" }}
{{- fail "backend.identity.impersonation.forwardAllExtras has moved to backend.identity.impersonation.extras.mode=all" }}
{{- end }}
{{- if not (or (eq $identityMode "requestheader") (eq $identityMode "impersonation")) }}
{{- fail "backend.identity.mode must be requestheader or impersonation" }}
{{- end }}
{{- if and (ne $identityMode "impersonation") $impersonation.rbac.create }}
{{- fail "backend.identity.impersonation.rbac.create requires backend.identity.mode=impersonation" }}
{{- end }}
{{- if eq $identityMode "impersonation" }}
{{- if not (or (eq $extrasMode "none") (eq $extrasMode "allowlist") (eq $extrasMode "all")) }}
{{- fail "backend.identity.impersonation.extras.mode must be none, allowlist, or all" }}
{{- end }}
{{- if and (ne $extrasMode "allowlist") $impersonation.extras.keys }}
{{- fail "backend.identity.impersonation.extras.keys requires backend.identity.impersonation.extras.mode=allowlist" }}
{{- end }}
{{- if and (eq $extrasMode "allowlist") (not $impersonation.extras.keys) }}
{{- fail "backend.identity.impersonation.extras.keys must be set when backend.identity.impersonation.extras.mode=allowlist" }}
{{- end }}
{{- end }}
{{- $metricsListenerEnabled := and .Values.metrics.listenAddress (ne (toString .Values.metrics.listenAddress) "0") -}}
{{- if and .Values.metrics.serviceMonitor.enabled (not $metricsListenerEnabled) }}
{{- fail "metrics.serviceMonitor.enabled requires the metrics listener (metrics.listenAddress must not be \"0\")" }}
{{- end }}
{{- if and .Values.metrics.vmServiceScrape.enabled (not $metricsListenerEnabled) }}
{{- fail "metrics.vmServiceScrape.enabled requires the metrics listener (metrics.listenAddress must not be \"0\")" }}
{{- end }}
{{- if and .Values.metrics.tls.enabled (not .Values.metrics.tls.secretName) }}
{{- fail "metrics.tls.enabled requires metrics.tls.secretName to point at a Secret with tls.crt and tls.key" }}
{{- end }}
{{- $requestheaderClientCert := .Values.backend.identity.requestheader.clientCert -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "apiservice-audit-proxy.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "apiservice-audit-proxy.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "apiservice-audit-proxy.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: server
        {{- if .Values.audit.testWebhookReceiver.enabled }}
        checksum/webhook-kubeconfig: {{ include (print $.Template.BasePath "/test-webhookreceiver/kubeconfig-secret.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "apiservice-audit-proxy.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "apiservice-audit-proxy.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: server
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          args:
            - --listen-address={{ .Values.server.listenAddress }}
            - --metrics-listen-address={{ .Values.metrics.listenAddress }}
            {{- if .Values.metrics.tls.enabled }}
            - --metrics-tls-cert-file={{ include "apiservice-audit-proxy.paths.metricsTLS" . }}/tls.crt
            - --metrics-tls-private-key-file={{ include "apiservice-audit-proxy.paths.metricsTLS" . }}/tls.key
            {{- end }}
            - --backend-url={{ required "backend.url is required" .Values.backend.url }}
            - --webhook-kubeconfig={{ include "apiservice-audit-proxy.paths.webhook" . }}/{{ .Values.audit.webhook.kubeconfigKey }}
            - --webhook-timeout={{ .Values.audit.webhook.timeout }}
            - --max-audit-body-bytes={{ .Values.audit.maxBodyBytes | int }}
            {{- if .Values.backend.tls.insecureSkipVerify }}
            - --backend-insecure-skip-verify
            {{- end }}
            {{- if .Values.backend.tls.serverName }}
            - --backend-server-name={{ .Values.backend.tls.serverName }}
            {{- end }}
            {{- if .Values.audit.captureTempDir }}
            - --capture-temp-dir={{ .Values.audit.captureTempDir }}
            {{- end }}
            - --tls-cert-file={{ include "apiservice-audit-proxy.paths.tls" . }}/tls.crt
            - --tls-private-key-file={{ include "apiservice-audit-proxy.paths.tls" . }}/tls.key
            {{- if .Values.backend.tls.caSecretName }}
            - --backend-ca-file={{ include "apiservice-audit-proxy.paths.backendCA" . }}/{{ .Values.backend.tls.caFileName }}
            {{- end }}
            {{- if and (eq $identityMode "requestheader") $requestheaderClientCert.secretName }}
            - --backend-client-cert-file={{ include "apiservice-audit-proxy.paths.backendClient" . }}/{{ $requestheaderClientCert.certFileName }}
            - --backend-client-key-file={{ include "apiservice-audit-proxy.paths.backendClient" . }}/{{ $requestheaderClientCert.keyFileName }}
            {{- end }}
            - --backend-identity-mode={{ $identityMode }}
            {{- if eq $identityMode "impersonation" }}
            - --backend-impersonation-token-file={{ $impersonation.tokenFile }}
            - --backend-impersonation-forward-uid={{ $impersonation.forwardUid }}
            {{- if eq $extrasMode "all" }}
            - --backend-impersonation-forward-all-extras=true
            {{- else if eq $extrasMode "allowlist" }}
            - --backend-impersonation-extra-keys={{ join "," $impersonation.extras.keys }}
            {{- end }}
            {{- end }}
            {{- with .Values.extraArgs }}
            {{- range . }}
            - {{ . | quote }}
            {{- end }}
            {{- end }}
          ports:
            - name: api
              containerPort: {{ .Values.server.containerPort }}
              protocol: TCP
            {{- if and .Values.metrics.listenAddress (ne (toString .Values.metrics.listenAddress) "0") }}
            - name: metrics
              containerPort: {{ .Values.metrics.containerPort }}
              protocol: TCP
            {{- end }}
          livenessProbe:
            httpGet:
              path: /livez
              port: api
              scheme: HTTPS
          readinessProbe:
            httpGet:
              path: /readyz
              port: api
              scheme: HTTPS
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          env:
            {{- with .Values.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: webhook-kubeconfig
              mountPath: {{ include "apiservice-audit-proxy.paths.webhook" . }}
              readOnly: true
            - name: serving-tls
              mountPath: {{ include "apiservice-audit-proxy.paths.tls" . }}
              readOnly: true
            {{- if .Values.backend.tls.caSecretName }}
            - name: backend-ca
              mountPath: {{ include "apiservice-audit-proxy.paths.backendCA" . }}
              readOnly: true
            {{- end }}
            {{- if and (eq $identityMode "requestheader") $requestheaderClientCert.secretName }}
            - name: backend-client
              mountPath: {{ include "apiservice-audit-proxy.paths.backendClient" . }}
              readOnly: true
            {{- end }}
            {{- if .Values.metrics.tls.enabled }}
            - name: metrics-tls
              mountPath: {{ include "apiservice-audit-proxy.paths.metricsTLS" . }}
              readOnly: true
            {{- end }}
            {{- with .Values.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: webhook-kubeconfig
          secret:
            secretName: {{ required "audit.webhook.kubeconfigSecretName is required" .Values.audit.webhook.kubeconfigSecretName }}
        - name: serving-tls
          secret:
            secretName: {{ include "apiservice-audit-proxy.servingSecretName" . }}
        {{- if .Values.backend.tls.caSecretName }}
        - name: backend-ca
          secret:
            secretName: {{ .Values.backend.tls.caSecretName }}
        {{- end }}
        {{- if and (eq $identityMode "requestheader") $requestheaderClientCert.secretName }}
        - name: backend-client
          secret:
            secretName: {{ $requestheaderClientCert.secretName }}
        {{- end }}
        {{- if .Values.metrics.tls.enabled }}
        - name: metrics-tls
          secret:
            secretName: {{ required "metrics.tls.secretName is required when metrics.tls.enabled=true" .Values.metrics.tls.secretName }}
        {{- end }}
        {{- with .Values.volumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
